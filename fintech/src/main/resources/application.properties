spring.application.name=fintech
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fintech}
spring.datasource.username=${DB_USER:fintech}
spring.datasource.password=${DB_PASSWORD:fintech}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always

# Cuenta de administrador: se crea sola al arrancar si no existe. Cambia la clave antes de entregar.
app.admin.identificacion=admin
app.admin.nombre=Administrador
app.admin.clave=admin123

# Carga 5 usuarios de demostración al arrancar (clave de todos: clave123). Ponlo en false para apagarlo.
app.datos-demo=true
