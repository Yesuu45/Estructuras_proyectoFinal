<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beneficios · Fintech</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <h1>Plataforma Fintech de Billeteras Digitales</h1>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="usuarios.html">Usuarios</a>
    <a href="billeteras.html">Billeteras</a>
    <a href="transacciones.html">Transacciones</a>
    <a href="programadas.html">Programadas</a>
    <a href="beneficios.html" class="activo">Beneficios</a>
    <a href="auditoria.html">Auditoría</a>
</nav>

<main>
    <div id="mensajes" class="mensaje" hidden></div>

    <section class="seccion">
        <h2>Canjear beneficio</h2>

        <form id="form-beneficio" class="formulario">
            <select name="idBeneficio" id="select-beneficio" required>
                <option value="">Cargando catálogo...</option>
            </select>
            <button type="submit">Canjear</button>
        </form>

        <h3>Catálogo disponible</h3>
        <table id="tabla-catalogo">
            <thead>
            <tr>
                <th>Código</th>
                <th>Beneficio</th>
                <th>Costo (pts)</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h3>Canjes realizados</h3>
        <table id="tabla-beneficios">
            <thead>
            <tr>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Beneficio</th>
                <th>Puntos</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</main>

<script src="js/comun.js"></script>
<script src="js/beneficios.js"></script>
</body>
</html>
