<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billeteras · Colibrí Pagos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <h1>Colibrí Pagos</h1>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="usuarios.html">Usuarios</a>
    <a href="billeteras.html" class="activo">Billeteras</a>
    <a href="transacciones.html">Transacciones</a>
    <a href="programadas.html">Programadas</a>
    <a href="beneficios.html">Beneficios</a>
    <a href="auditoria.html">Auditoría</a>
</nav>

<main>
    <div id="mensajes" class="mensaje" hidden></div>

    <section class="seccion">
        <h2>Billeteras</h2>
        <p class="nota">Las billeteras nuevas se crean a tu nombre.</p>

        <form id="form-billetera" class="formulario">
            <label style="display:flex;flex-direction:column;gap:4px;flex:1 1 180px;font-size:.9rem;color:var(--tinta-suave)">
                Nombre de la cuenta
                <input name="nombre" required placeholder="Ej: Ahorros de viaje">
            </label>

            <label style="display:flex;flex-direction:column;gap:4px;flex:1 1 160px;font-size:.9rem;color:var(--tinta-suave)">
                Tipo
                <select name="tipo">
                    <option value="AHORROS">Ahorros</option>
                    <option value="CORRIENTE">Corriente</option>
                    <option value="DIGITAL">Digital</option>
                </select>
            </label>

            <label style="display:flex;flex-direction:column;gap:4px;flex:1 1 160px;font-size:.9rem;color:var(--tinta-suave)">
                Saldo inicial
                <input name="saldoInicial" type="number" min="0" step="any" value="0" required>
            </label>

            <label style="display:flex;flex-direction:column;gap:4px;flex:1 1 160px;font-size:.9rem;color:var(--tinta-suave)">
                Aviso de saldo bajo
                <input name="umbralSaldoBajo" type="number" min="0" step="any" value="0" required>
            </label>

            <button type="submit">Crear billetera</button>
        </form>

        <table id="tabla-billeteras">
            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Titular</th>
                <th>Saldo</th>
                <th>Estado</th>
                <th></th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section class="seccion" id="seccion-historial" hidden>
        <h2 id="titulo-historial">Historial</h2>
        <table id="tabla-historial">
            <thead>
            <tr>
                <th>Id</th>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</main>

<script src="js/comun.js"></script>
<script src="js/billeteras.js"></script>
</body>
</html>
