<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transacciones · Colibrí Pagos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <h1>Colibrí Pagos</h1>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="usuarios.html">Usuarios</a>
    <a href="billeteras.html">Billeteras</a>
    <a href="transacciones.html" class="activo">Transacciones</a>
    <a href="programadas.html">Programadas</a>
    <a href="beneficios.html">Beneficios</a>
    <a href="auditoria.html">Auditoría</a>
</nav>

<main>
    <div id="mensajes" class="mensaje" hidden></div>

    <section class="seccion">
        <h2>Transacciones</h2>

        <form id="form-transaccion" class="formulario">
            <label style="display:flex;flex-direction:column;gap:4px;flex:1 1 160px;font-size:.9rem;color:var(--tinta-suave)">
                Tipo
                <select name="tipo" id="select-tipo">
                    <option value="RECARGA">Recarga</option>
                    <option value="RETIRO">Retiro</option>
                    <option value="TRANSFERENCIA">Transferencia</option>
                </select>
            </label>

            <label id="campo-origen" style="display:flex;flex-direction:column;gap:4px;flex:1 1 220px;font-size:.9rem;color:var(--tinta-suave)">
                Cuenta de origen
                <select name="codigoOrigen" id="select-origen"></select>
            </label>

            <label id="campo-destino" style="display:flex;flex-direction:column;gap:4px;flex:1 1 220px;font-size:.9rem;color:var(--tinta-suave)">
                Cuenta de destino
                <select name="codigoDestino" id="select-destino"></select>
            </label>

            <label style="display:flex;flex-direction:column;gap:4px;flex:1 1 140px;font-size:.9rem;color:var(--tinta-suave)">
                Valor
                <input name="valor" type="number" min="1" step="any" required>
            </label>

            <button type="submit">Registrar</button>
        </form>

        <table id="tabla-transacciones">
            <thead>
            <tr>
                <th>Id</th>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Estado</th>
                <th>Puntos</th>
                <th></th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</main>

<script src="js/comun.js"></script>
<script src="js/transacciones.js"></script>
</body>
</html>
