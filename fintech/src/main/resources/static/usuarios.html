<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Plataforma Fintech</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <h1>Plataforma Fintech de Billeteras Digitales</h1>
</header>
<nav>
    <a href="index.html">Inicio</a>
    <a href="usuarios.html">Usuarios</a>
    <a href="billeteras.html">Billeteras</a>
    <a href="transacciones.html">Transacciones</a>
    <a href="programadas.html">Programadas</a>
    <a href="beneficios.html">Beneficios</a>
    <a href="auditoria.html">Auditoría</a>
</nav>
<main>
    <div id="mensajes" class="mensaje" hidden></div>
    <section class="seccion">
        <h2>Usuarios</h2>
        <table>
            <thead>
                <tr><th>Identificación</th><th>Nombre</th><th>Correo</th><th>Puntos</th><th>Nivel</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tabla-usuarios"></tbody>
        </table>
    </section>
    <section class="seccion" id="seccion-edicion" hidden>
        <h2>Modificar usuario <span id="editando"></span></h2>
        <form id="form-edicion" class="formulario">
            <input name="nombre" placeholder="Nombre" required>
            <input name="correo" type="email" placeholder="Correo">
            <input name="clave" type="password" minlength="6" placeholder="Nueva contraseña (opcional)" autocomplete="new-password">
            <button type="submit">Guardar cambios</button>
            <button type="button" id="cancelar-edicion" class="secundario">Cancelar</button>
        </form>
        <p class="nota">La identificación no se puede cambiar. Para eliminar a un usuario no debe tener billeteras.</p>
    </section>
</main>
<script src="js/comun.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
